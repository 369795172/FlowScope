services:
  postgres:
    image: postgres:15-alpine
    container_name: marquez-postgres
    environment:
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
      POSTGRES_DB: marquez
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marquez"]
      interval: 10s
      timeout: 5s
      retries: 5

  marquez-api:
    image: marquezproject/marquez:latest
    platform: linux/amd64
    container_name: marquez-api
    environment:
      - MARQUEZ_CONFIG=/etc/marquez/marquez.yml
      - MARQUEZ_HOST=0.0.0.0
      - MARQUEZ_PORT=5000
      - MARQUEZ_ADMIN_PORT=5001
      - MARQUEZ_DB_HOST=postgres
      - MARQUEZ_DB_PORT=5432
      - MARQUEZ_DB=marquez
      - MARQUEZ_DB_USER=marquez
      - MARQUEZ_DB_PASSWORD=marquez
    volumes:
      - ./marquez.yml:/etc/marquez/marquez.yml:ro
    ports:
      - "5002:5000"
      - "5003:5001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/namespaces"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  marquez-web:
    image: marquezproject/marquez-web:latest
    platform: linux/amd64
    container_name: marquez-web
    environment:
      - MARQUEZ_HOST=marquez-api
      - MARQUEZ_PORT=5000
      - MARQUEZ_API_URL=http://marquez-api:5000
      - WEB_PORT=3000
    ports:
      - "3000:3000"
    depends_on:
      marquez-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
